<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryWeave - AI Story Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Crimson+Text&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Outfit',sans-serif;
background:#0f1419;
color:white;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
}

textarea,select{
width:100%;
padding:12px;
margin-top:8px;
background:#1a1f2e;
border:1px solid #444;
color:white;
border-radius:6px;
}

button{
margin-top:20px;
padding:14px;
width:100%;
background:#ff006e;
border:none;
color:white;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

.story-section{
margin-top:40px;
background:#1a1f2e;
padding:20px;
border-radius:8px;
}

.story-content{
line-height:1.7;
white-space:pre-wrap;
}

.error{
color:#ff6b6b;
margin-top:20px;
}

.meta-tag{
background:#333;
padding:5px 10px;
margin-right:10px;
border-radius:5px;
font-size:12px;
}

.loading-spinner{
border:3px solid rgba(255,255,255,0.2);
border-top:3px solid white;
border-radius:50%;
width:16px;
height:16px;
display:inline-block;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

</style>
</head>

<body>

<div class="container">

<h1>StoryWeave</h1>

<form id="storyForm">

<label>Story Prompt</label>
<textarea id="prompt" required></textarea>

<label>Genre</label>
<select id="genre">
<option value="fantasy">Fantasy</option>
<option value="science fiction">Sci-Fi</option>
<option value="horror">Horror</option>
<option value="romance">Romance</option>
<option value="adventure">Adventure</option>
</select>

<label>Tone</label>
<select id="tone">
<option value="dramatic">Dramatic</option>
<option value="dark">Dark</option>
<option value="humorous">Humorous</option>
<option value="poetic">Poetic</option>
</select>

<label>Length</label>
<select id="length">
<option value="short">Short</option>
<option value="medium" selected>Medium</option>
<option value="long">Long</option>
</select>

<button type="submit" id="generateBtn">
<span id="btnText">Generate Story</span>
</button>

</form>

<div id="error"></div>
<div id="story"></div>

</div>

<script>

const API_URL="/api";

const form=document.getElementById("storyForm");
const storyBox=document.getElementById("story");
const errorBox=document.getElementById("error");
const btn=document.getElementById("generateBtn");
const btnText=document.getElementById("btnText");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

errorBox.innerHTML="";
storyBox.innerHTML="";

const prompt=document.getElementById("prompt").value.trim();

if(!prompt){
errorBox.innerHTML='<div class="error">Please enter a prompt</div>';
return;
}

const data={
prompt:prompt,
genre:document.getElementById("genre").value,
tone:document.getElementById("tone").value,
length:document.getElementById("length").value
};

btn.disabled=true;
btnText.innerHTML='<span class="loading-spinner"></span> Generating...';

try{

const res=await fetch(`${API_URL}/generate-story`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

const result=await res.json();

if(!res.ok){
throw new Error(result.error || "Failed to generate story");
}

let storyText=result.story;

/* FIX: prevent object bug */

if(typeof storyText==="object"){

if(storyText.content){
storyText=storyText.content;
}

else if(storyText.text){
storyText=storyText.text;
}

else{
storyText=JSON.stringify(storyText,null,2);
}

}

storyBox.innerHTML=`

<div class="story-section">

<div>
<span class="meta-tag">${result.genre || ""}</span>
<span class="meta-tag">${result.tone || ""}</span>
</div>

<div class="story-content" id="storyText">
${storyText}
</div>

</div>

`;

}catch(err){

errorBox.innerHTML=`<div class="error">${err.message}</div>`;

}

btn.disabled=false;
btnText.textContent="Generate Story";

});

</script>

</body>
</html>
